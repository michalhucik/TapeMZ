# Překlad a testy na Linuxu a ve Windows (MSYS2 UCRT64).
# Testy, které potřebují adresář tstdata/, vypíšou SKIP a skončí úspěšně.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show tool versions
        run: |
          gcc --version | head -1
          cmake --version | head -1
          python3 --version
      - name: Build and test
        run: make test

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
      - name: Show tool versions
        run: |
          gcc --version | head -1
          cmake --version | head -1
          python3 --version || python --version
      - name: Build and test
        run: make test
